<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F2B705"><title>تكاليف المشاريع</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:Tahoma,'Segoe UI',sans-serif;color:#18222d;background:#eff0ec}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:18px 16px 100px}h1{font-size:1.5rem;margin:0}h2{font-size:1.1rem}button,input,select{font:inherit}button{border:1px solid #cad0d1;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f2b705}button.primary{background:#f2b705;border-color:#f2b705;font-weight:bold}.top,.row,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:20px}.panel{background:white;border:1px solid #d5d8d1;border-radius:12px;padding:18px;margin:14px 0}.muted{color:#5b6671}.error{color:#b53a25}.success{color:#2f7a55}.field{display:block;margin:12px 0}.field span{display:block;margin-bottom:5px}.field input,.field select,select.project{width:100%;padding:11px;border:1px solid #bac2c5;border-radius:8px;background:white;min-height:44px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fff;padding:17px;border:1px solid #d5d8d1;border-radius:12px}.metric b{display:block;font-size:1.5rem}.item{border-bottom:1px solid #ddd;padding:10px 0;display:flex;justify-content:space-between;gap:12px}.item:last-child{border:0}.small{font-size:.85rem}.detail{display:flex;justify-content:space-between;gap:8px;align-items:center}.detail input{max-width:170px}.detail input[type=number]{max-width:130px}dialog{border:0;border-radius:14px;width:min(540px,95vw);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#18222daa}.notice{position:sticky;top:0;background:#fff4cb;padding:8px;border:1px solid #f2b705;border-radius:8px;z-index:2}#msg:empty{display:none}@media(prefers-color-scheme:dark){:root{background:#12161b;color:#e7eae5}.panel,.metric,button,.field input,.field select,select.project,dialog{background:#1b2128;color:#e7eae5;border-color:#2d353e}.muted{color:#99a3ac}.notice{background:#453a18;color:#f2e3b0}}@media(max-width:650px){.grid{grid-template-columns:1fr}.detail{flex-wrap:wrap}.actions button{flex:1}.top{align-items:stretch}}
</style></head><body><main><header class="top"><h1>تكاليف المشاريع</h1><div id="account"></div></header><p class="notice" id="msg" role="status"></p><div id="app"></div></main><dialog id="dialog"></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
(()=>{'use strict';const app=document.querySelector('#app'),account=document.querySelector('#account'),msg=document.querySelector('#msg'),dialog=document.querySelector('#dialog');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});const today=()=>new Date().toLocaleDateString('en-CA');let db,user,projects=[],active,role,cats=[],expenses=[],budgets={},finance={progress:0},members=[];
function say(s,err=false){msg.textContent=s;msg.className=err?'notice error':'notice success'}function fail(e){say(e?.message||'تعذّر تنفيذ العملية.',true)}function v(id){return document.getElementById(id)?.value?.trim()||''}function field(id,label,value='',type='text'){return `<label class="field"><span>${esc(label)}</span><input id="${id}" type="${type}" value="${esc(value)}"></label>`}function close(){dialog.close();dialog.innerHTML=''}function open(html){dialog.innerHTML=html;dialog.showModal()}async function query(q){const {data,error}=await q;if(error)throw error;return data}
async function start(){if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase){app.innerHTML='<div class="panel">إعداد الاتصال بقاعدة البيانات لم يكتمل بعد.</div>';return}db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(()=>refresh(),0)});const {data}=await db.auth.getSession();user=data.session?.user||null;await refresh()}
async function refresh(){account.innerHTML=user?`<span class="small">${esc(user.email)}</span> <button id="out">خروج</button>`:'';if(!user){app.innerHTML=`<section class="panel"><h2>تسجيل الدخول</h2><p>اكتب بريدك الإلكتروني. هنرسل لك رابط دخول آمن.</p>${field('email','البريد الإلكتروني','','email')}<button class="primary" id="login">أرسل رابط الدخول</button></section>`;return}try{projects=await query(db.from('projects').select('id,name,owner_id').order('created_at'));if(!projects.some(p=>p.id===active))active=projects[0]?.id;await loadProject()}catch(e){fail(e)}}
async function loadProject(){if(!active){app.innerHTML=`<section class="panel"><h2>لا توجد مشاريع متاحة</h2><p>إذا أضافك صاحب المشروع، سجّل الدخول بنفس البريد الذي شارك المشروع معه.</p><button class="primary" id="new">إنشاء مشروع</button><button id="import">استيراد بياناتي القديمة من هذا المتصفح</button></section>`;return}try{const p=projects.find(x=>x.id===active);const rows=await query(db.from('project_access').select('email,role').eq('project_id',active));role=p.owner_id===user.id?'owner':rows.find(x=>x.email===user.email.toLowerCase())?.role||'invoice';cats=await query(db.from('categories').select('id,name').eq('project_id',active).order('name'));if(role!=='invoice'){const [b,f,x]=await Promise.all([query(db.from('category_budgets').select('category_id,budget').in('category_id',cats.length?cats.map(c=>c.id):['00000000-0000-0000-0000-000000000000'])),query(db.from('project_financials').select('progress').eq('project_id',active).maybeSingle()),query(db.from('expenses').select('id,category_id,description,amount,expense_date,reference').eq('project_id',active).order('expense_date',{ascending:false}))]);budgets=Object.fromEntries(b.map(i=>[i.category_id,Number(i.budget)]));finance=f||{progress:0};expenses=x}else{budgets={};expenses=[];finance={progress:0}}members=role==='owner'?rows:[];render()}catch(e){fail(e)}}
function render(){const p=projects.find(x=>x.id===active),full=role!=='invoice',total=Object.values(budgets).reduce((a,b)=>a+b,0),spent=expenses.reduce((a,b)=>a+Number(b.amount),0),ev=total*Number(finance.progress)/100,cpi=spent&&ev?ev/spent:null;app.innerHTML=`<div class="row"><select class="project" id="project" aria-label="المشروع">${projects.map(p=>`<option value="${esc(p.id)}" ${p.id===active?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button id="new">مشروع جديد</button></div><p class="muted small">${role==='owner'?'مالك المشروع':full?'صلاحية عرض وتعديل كامل':'صلاحية إدخال الفواتير فقط'}</p>${full?`<div class="grid"><div class="metric">الميزانية <b>${money(total)} ر.س</b></div><div class="metric">المصروف <b>${money(spent)} ر.س</b></div><div class="metric">الإنجاز <b>${money(finance.progress)}%</b></div></div><div class="panel"><div class="detail"><span>المتبقي: <b>${money(total-spent)} ر.س</b></span><span>CPI: <b>${cpi?cpi.toFixed(2):'—'}</b></span><span>EAC: <b>${cpi?money(total/cpi):'—'}</b></span></div></div>`:''}<div class="actions"><button class="primary" id="addExpense">إدخال فاتورة</button>${full?`<button id="editProject">تعديل المشروع والإنجاز</button><button id="addCategory">إضافة بند</button>`:''}${role==='owner'?`<button id="import">استيراد بياناتي القديمة</button><button id="shareFull">مشاركة: تحكم كامل</button><button id="shareInvoice">مشاركة: إدخال فواتير</button>`:''}</div><section class="panel"><h2>البنود</h2>${cats.length?cats.map(c=>`<div class="item"><div>${esc(c.name)} ${full?`<span class="muted small">— الميزانية ${money(budgets[c.id])}، المصروف ${money(expenses.filter(e=>e.category_id===c.id).reduce((s,e)=>s+Number(e.amount),0))}</span>`:''}</div>${full?`<button data-cat="${c.id}">تعديل</button>`:''}</div>`).join(''):'لا توجد بنود بعد'}</section>${full?`<section class="panel"><h2>الفواتير</h2>${expenses.length?expenses.map(e=>`<div class="item"><div>${esc(e.description)} <span class="muted small">${esc(e.expense_date)} · ${esc(cats.find(c=>c.id===e.category_id)?.name||'')}</span><br><b>${money(e.amount)} ر.س</b> ${esc(e.reference)}</div><button data-exp="${e.id}">تعديل</button></div>`).join(''):'لا توجد فواتير'}</section>`:''}${role==='owner'?`<section class="panel"><h2>المشاركون</h2>${members.length?members.map(m=>`<div class="item"><span>${esc(m.email)} — ${m.role==='editor'?'تحكم كامل':'إدخال فواتير'}</span><button data-member="${esc(m.email)}">تعديل/إلغاء</button></div>`).join(''):'لم تتم مشاركة هذا المشروع بعد'}</section>`:''}`}
async function importOld(){
 const old=JSON.parse(localStorage.getItem('project-costs-v1')||'null');
 if(!old?.catalog?.projects?.length)throw Error('لا توجد بيانات قديمة محفوظة في هذا المتصفح. افتح الموقع القديم على نفس الجهاز والمتصفح أولًا.');
 if(!confirm(`استيراد ${old.catalog.projects.length} مشروع؟ ستُضاف نسخ جديدة ولن تُحذف بياناتك القديمة.`))return;
 let done=0;
 for(const p of old.catalog.projects){
  const created=await query(db.from('projects').insert({name:p.name,owner_id:user.id}).select('id').single());
  const projectId=created.id,details=old.budget?.projects?.[p.id]||{};
  await query(db.from('project_financials').insert({project_id:projectId,progress:Number(details.progress)||0}));
  const ids={};for(const c of p.cats||[]){const nc=await query(db.from('categories').insert({project_id:projectId,name:c.name}).select('id').single());ids[c.id]=nc.id;await query(db.from('category_budgets').insert({category_id:nc.id,budget:Number(details.budgets?.[c.id])||0}))}
  const rows=(old.entries?.items||[]).filter(x=>x.projectId===p.id&&ids[x.catId]).map(x=>({project_id:projectId,category_id:ids[x.catId],description:x.desc||'مصروف',amount:Number(x.amount),expense_date:x.date||today(),reference:x.ref||''})).filter(x=>x.amount>0);
  for(let i=0;i<rows.length;i+=100)await query(db.from('expenses').insert(rows.slice(i,i+100)));
  done++;
 }
 await refresh();say(`تم استيراد ${done} مشروع. راجع الأرقام قبل مشاركة الوصول.`)
}
async function createProject(name){const p=await query(db.from('projects').insert({name,owner_id:user.id}).select().single());await query(db.from('project_financials').insert({project_id:p.id,progress:0}));active=p.id;await refresh()}
function shareForm(which,email='',existing=false){open(`<h2>${which==='editor'?'مشاركة التحكم الكامل':'مشاركة إدخال الفواتير'}</h2><p>حدّد بريد الشخص. بعد الحفظ، أرسل له رابط الموقع؛ لازم يسجل الدخول بنفس البريد.</p>${field('shareEmail','البريد الإلكتروني',email,'email')}<div class="actions"><button class="primary" id="saveShare">حفظ الصلاحية</button>${existing?'<button id="removeShare">إلغاء الوصول</button>':''}<button id="cancel">إغلاق</button></div>`);dialog.dataset.role=which;dialog.dataset.old=email}
async function doSaveShare(){const email=v('shareEmail').toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('اكتب بريدًا إلكترونيًا صحيحًا');if(email===user.email.toLowerCase())throw Error('هذا بريدك أنت');if(dialog.dataset.old&&dialog.dataset.old!==email)await query(db.from('project_access').delete().eq('project_id',active).eq('email',dialog.dataset.old));await query(db.from('project_access').upsert({project_id:active,email,role:dialog.dataset.role}));close();await loadProject();say('تم حفظ الصلاحية. أرسل رابط الموقع للشخص.')}
async function saveExpense(edit){const amount=Number(v('amount'));if(!v('desc')||!(amount>0)||!v('cat'))throw Error('أكمل وصف الفاتورة والبند والمبلغ');const row={project_id:active,category_id:v('cat'),description:v('desc'),amount,expense_date:v('date')||today(),reference:v('ref')};if(edit)await query(db.from('expenses').update(row).eq('id',edit));else await query(db.from('expenses').insert(row));close();await loadProject();say('تم حفظ الفاتورة')}
function expenseForm(e){if(!cats.length){say('أضف بندًا للمشروع أولًا',true);return}open(`<h2>${e?'تعديل فاتورة':'إدخال فاتورة'}</h2>${field('desc','الوصف',e?.description||'')}<label class="field"><span>البند</span><select id="cat">${cats.map(c=>`<option value="${c.id}" ${c.id===e?.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>${field('amount','المبلغ (ر.س)',e?.amount||'','number')}${field('date','التاريخ',e?.expense_date||today(),'date')}${field('ref','رقم الفاتورة أو المرجع',e?.reference||'')}<div class="actions"><button class="primary" id="saveExpense">حفظ</button>${e?'<button id="deleteExpense">حذف الفاتورة</button>':''}<button id="cancel">إغلاق</button></div>`);dialog.dataset.edit=e?.id||''}
function categoryForm(c){open(`<h2>${c?'تعديل البند':'إضافة بند'}</h2>${field('catName','اسم البند',c?.name||'')}${field('budget','الميزانية (ر.س)',c?budgets[c.id]:0,'number')}<div class="actions"><button class="primary" id="saveCategory">حفظ</button>${c?'<button id="deleteCategory">حذف البند</button>':''}<button id="cancel">إغلاق</button></div>`);dialog.dataset.edit=c?.id||''}
async function saveCategory(){const name=v('catName'),budget=Number(v('budget'));if(!name||!Number.isFinite(budget)||budget<0)throw Error('اكتب اسمًا وميزانية صحيحة');let id=dialog.dataset.edit;if(id)await query(db.from('categories').update({name}).eq('id',id));else{id=(await query(db.from('categories').insert({name,project_id:active}).select('id').single())).id}await query(db.from('category_budgets').upsert({category_id:id,budget}));close();await loadProject();say('تم حفظ البند')}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.id==='login'){const email=v('email');if(!email)throw Error('اكتب البريد الإلكتروني');await query(db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}));say('تم إرسال رابط الدخول إلى بريدك')}else if(b.id==='new'){open(`<h2>مشروع جديد</h2>${field('newName','اسم المشروع')}<button class="primary" id="saveNew">إنشاء</button><button id="cancel">إلغاء</button>`)}else if(b.id==='import')await importOld();else if(b.id==='addExpense')expenseForm();else if(b.id==='editProject'){open(`<h2>تعديل المشروع</h2>${field('projectName','اسم المشروع',projects.find(p=>p.id===active).name)}${field('progress','نسبة الإنجاز %',finance.progress,'number')}<button class="primary" id="saveProject">حفظ</button><button id="cancel">إغلاق</button>`)}else if(b.id==='addCategory')categoryForm();else if(b.id==='shareFull')shareForm('editor');else if(b.id==='shareInvoice')shareForm('invoice');else if(b.dataset.cat)categoryForm(cats.find(c=>c.id===b.dataset.cat));else if(b.dataset.exp)expenseForm(expenses.find(x=>x.id===b.dataset.exp));else if(b.dataset.member)shareForm(members.find(x=>x.email===b.dataset.member).role,b.dataset.member,true)}catch(e){fail(e)}});
app.addEventListener('change',e=>{if(e.target.id==='project'){active=e.target.value;loadProject()}});
dialog.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.id==='cancel')close();else if(b.id==='saveNew'){if(!v('newName'))throw Error('اكتب اسم المشروع');await createProject(v('newName'));close();say('تم إنشاء المشروع')}else if(b.id==='saveShare')await doSaveShare();else if(b.id==='removeShare'){if(!confirm('إلغاء وصول هذا الشخص للمشروع؟'))return;await query(db.from('project_access').delete().eq('project_id',active).eq('email',dialog.dataset.old));close();await loadProject();say('تم إلغاء الوصول')}else if(b.id==='saveExpense')await saveExpense(dialog.dataset.edit);else if(b.id==='deleteExpense'){if(!confirm('حذف هذه الفاتورة؟'))return;await query(db.from('expenses').delete().eq('id',dialog.dataset.edit));close();await loadProject()}else if(b.id==='saveCategory')await saveCategory();else if(b.id==='deleteCategory'){if(!confirm('حذف البند؟ لن يُحذف إذا له فواتير.'))return;await query(db.from('categories').delete().eq('id',dialog.dataset.edit));close();await loadProject()}else if(b.id==='saveProject'){const progress=Number(v('progress'));if(!v('projectName')||progress<0||progress>100)throw Error('أدخل اسمًا ونسبة من 0 إلى 100');await query(db.from('projects').update({name:v('projectName')}).eq('id',active));await query(db.from('project_financials').upsert({project_id:active,progress}));close();await refresh();say('تم حفظ المشروع')}}catch(e){fail(e)}});
account.addEventListener('click',async e=>{if(e.target.id==='out'){await db.auth.signOut();user=null;await refresh()}});start();
})();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
