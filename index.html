<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>تكاليف المشاريع</title><meta name="theme-color" content="#F2B705"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--paper:#EFF0EC;--surface:#FFFFFF;--ink:#18222D;--muted:#5B6671;--line:#D5D8D1;--hivis:#F2B705;--hivis-ink:#18222D;--under:#2F7A55;--over:#B53A25;--warn:#A86F00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12161B;--surface:#1B2128;--ink:#E7EAE5;--muted:#99A3AC;--line:#2D353E;--hivis:#F2B705;--hivis-ink:#12161B;--under:#5DBB8A;--over:#E6694F;--warn:#E8B23A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12161B;--surface:#1B2128;--ink:#E7EAE5;--muted:#99A3AC;--line:#2D353E;--hivis:#F2B705;--hivis-ink:#12161B;--under:#5DBB8A;--over:#E6694F;--warn:#E8B23A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#root{max-width:760px;margin:0 auto;padding:16px 16px 160px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hivis);outline-offset:2px}
.primary{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis);font-weight:700}
.link{border:0;background:none;padding:6px 4px;min-height:32px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top select{flex:1;min-width:0;font-size:1.15rem;font-weight:700;background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:6px 0;min-height:44px}
.status{width:100%;font-size:.85rem;color:var(--muted);min-height:1.4em}
.hero{margin-top:12px;padding:20px 0 8px;border-top:1px solid var(--line)}
.hero-nums{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lbl{display:block;font-size:.85rem;color:var(--muted)}
.big .val{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:700;line-height:1.1;letter-spacing:-.01em}
.big .cur{font-size:1rem;color:var(--muted);margin-inline-start:6px}
.side{display:flex;gap:24px}
.side b{font-size:1.15rem}
.neg{color:var(--over)}
.pos{color:var(--under)}
.ruler{margin-top:22px}
.track{position:relative;height:34px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:visible}
.fill{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--hivis);border-radius:3px 0 0 3px}
.overrun{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--over) 0 8px,var(--hivis) 8px 16px)}
.tick{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--muted);opacity:.45}
.bmark{position:absolute;top:-10px;bottom:-10px;width:3px;margin-inline-start:-1px;background:var(--ink)}
.ev{position:absolute;bottom:-14px;width:0;height:0}
.ev i{position:absolute;inset-inline-start:-7px;top:0;border-inline:7px solid transparent;border-bottom:10px solid var(--ink)}
.scale{position:relative;height:22px;margin-top:14px;font-size:.75rem;color:var(--muted)}
.scale span{position:absolute;transform:translateX(50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;vertical-align:middle;margin-inline-end:6px}
.lg-fill::before{width:14px;height:10px;background:var(--hivis)}
.lg-ev::before{border-inline:6px solid transparent;border-bottom:9px solid var(--ink)}
.lg-b::before{width:3px;height:14px;background:var(--ink)}
.hint{font-size:.9rem;color:var(--muted);margin:10px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:20px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-size:1.25rem}
.kpi small{display:block;color:var(--muted);font-size:.75rem;line-height:1.4;margin-top:2px}
.block{margin-top:32px}
.block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
h2{font-size:1.1rem;margin:0}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat-top{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--under);border-radius:3px}
.bar i.warn{background:var(--hivis)}
.bar i.over{background:var(--over)}
.cat-meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips button{white-space:nowrap;border-radius:999px;min-height:34px;padding:4px 12px;font-size:.85rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item-main{min-width:0}
.item-desc{font-weight:500;overflow-wrap:anywhere}
.item-meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.item-end{text-align:end;flex-shrink:0}
.item-end b{display:block}
.del.armed{color:var(--over);font-weight:700}
.empty{padding:24px 0;color:var(--muted)}
.dock{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;z-index:5}
.dock{flex-wrap:wrap}.dock .primary{flex:1 1 100%;max-width:420px;min-height:48px;font-size:1.05rem}.dock button:not(.primary){flex:1;white-space:nowrap;font-size:.82rem;padding:6px}
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dlg{padding:20px;overflow-y:auto;max-height:calc(100vh - 40px)}
.dlg h3{margin:0 0 14px;font-size:1.15rem}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field select,.catrow input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:44px}
.catrow{display:grid;grid-template-columns:1fr 130px auto;gap:6px;margin-bottom:6px;align-items:center}
.catrow button{min-height:44px;padding:6px 10px}
.row-end{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.err{color:var(--over);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.danger{color:var(--over)}
.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
.who{color:var(--ink);opacity:.8}
.loading{padding:48px 0;color:var(--muted);text-align:center}
.notice{padding:32px 0;line-height:1.8}
.notice h1{font-size:1.3rem;margin:0 0 8px}
.emp-form{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.emp-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emp-form .primary{width:100%;min-height:48px;font-size:1.05rem;margin-top:4px}
.ok{color:var(--under);font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.role{font-size:.8rem;color:var(--muted)}
</style></head>
<body><div id="root"><div class="loading">جارٍ التحميل…</div></div><dialog id="dlg"></dialog>
<script>
(function(){
const DEFAULT_CATS=['مواد','عمالة','معدات','مقاولو باطن','مصاريف عامة وإدارية'];
const UI_KEY='cost-tracker-ui2';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const num=v=>parseFloat(String(v==null?'':v).replace(/[,،\s]/g,'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const root=document.getElementById('root');
const STORE='project-costs-v1';
function saveLocal(){localStorage.setItem(STORE,JSON.stringify({catalog,budget,entries}));}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');catalog=x.catalog||{projects:[]};budget=x.budget||{projects:{}};entries=x.entries||{items:[]};if(!Array.isArray(catalog.projects))catalog.projects=[];if(!budget.projects||typeof budget.projects!=='object')budget.projects={};if(!Array.isArray(entries.items))entries.items=[];}catch(e){catalog={projects:[]};budget={projects:{}};entries={items:[]};}}
let db=null,user=null,dl=null,me=null;
let catalog=null,budget={projects:{}},entries={items:[]},invoices={},names={};
let ui={active:null,filter:'all'};
try{Object.assign(ui,JSON.parse(sessionStorage.getItem(UI_KEY)||'{}'))}catch(e){}
let statusMsg='',armed=null;
const stashUi=()=>{try{sessionStorage.setItem(UI_KEY,JSON.stringify(ui))}catch(e){}};
function setStatus(m){statusMsg=m;const el=document.getElementById('status');if(el)el.textContent=m}

function write(path,body){try{saveLocal();return Promise.resolve()}catch(e){return Promise.reject(e)}}
function writeErr(e){return 'تعذّر حفظ البيانات على الجهاز. تأكد من وجود مساحة تخزين كافية.';}
function notice(title,body){root.innerHTML='<div class="notice"><h1>'+esc(title)+'</h1><p>'+esc(body)+'</p></div>'}

/* ---------- start ---------- */
loadLocal();startOwner();
/* ================= OWNER ================= */
function startOwner(){render()}
function allItems(){
  const out=entries.items.map(i=>Object.assign({},i,{src:'owner'}));
  for(const u in invoices)invoices[u].items.forEach(i=>out.push(Object.assign({},i,{src:u})));
  return out;
}
function projView(pid){
  const c=catalog.projects.find(p=>p.id===pid);if(!c)return null;
  const b=budget.projects[pid]||{},bs=b.budgets||{};
  return{id:c.id,name:c.name,progress:+b.progress||0,cats:(c.cats||[]).map(x=>({id:x.id,name:x.name,budget:+bs[x.id]||0})),items:allItems().filter(i=>i.projectId===pid)};
}
function calc(p){
  const BAC=p.cats.reduce((s,c)=>s+c.budget,0),by={};p.cats.forEach(c=>by[c.id]=0);let AC=0;
  p.items.forEach(i=>{const a=+i.amount||0;AC+=a;if(i.catId in by)by[i.catId]+=a});
  const pr=Math.min(100,Math.max(0,p.progress))/100,EV=BAC*pr,CPI=(AC>0&&EV>0)?EV/AC:null,EAC=CPI?BAC/CPI:null,VAC=EAC!=null?BAC-EAC:null;
  return{BAC,AC,EV,pr,CPI,EAC,VAC,by,rem:BAC-AC};
}
const who=i=>i.src==='owner'?'أنت':(names[i.src]||'موظف');

function render(){
  if(!catalog)return;
  if(!catalog.projects.length){
    root.innerHTML='<div class="notice"><h1>ابدأ بإنشاء مشروع</h1><p>أنشئ مشروعًا وحدّد بنوده، ثم أضف المصروفات. البيانات محفوظة على هذا الجهاز؛ صدّر نسخة احتياطية بانتظام.</p><button class="primary" data-act="new">إنشاء مشروع</button> <button data-act="restore">استعادة نسخة احتياطية</button></div><div class="status" id="status">'+esc(statusMsg)+'</div>';return;
  }
  if(!catalog.projects.some(p=>p.id===ui.active))ui.active=catalog.projects[0].id;
  const p=projView(ui.active),k=calc(p),scale=Math.max(k.BAC,k.AC)||1;
  const bPos=k.BAC/scale*100,fillW=Math.min(k.AC,k.BAC||k.AC)/scale*100,overW=k.BAC?Math.max(0,k.AC-k.BAC)/scale*100:0,evPos=k.EV/scale*100;
  const catName=id=>(p.cats.find(c=>c.id===id)||{}).name||'بدون بند';
  let ticks='';if(k.BAC)for(const f of [.25,.5,.75])ticks+='<span class="tick" style="inset-inline-start:'+(f*bPos)+'%"></span>';
  const scaleLbl=k.BAC?[0,.5,1].map(f=>'<span class="num" style="inset-inline-start:'+(f*bPos)+'%;'+(f===0?'transform:none':'')+'">'+Math.round(f*100)+'%</span>').join(''):'';
  const cats=p.cats.map(c=>{const a=k.by[c.id]||0,b=c.budget,pct=b?a/b*100:(a?100:0),v=b-a,cls=pct>100?'over':pct>=90?'warn':'';
    return '<div class="cat"><div class="cat-top"><span>'+esc(c.name)+'</span><span class="num '+(pct>100?'neg':'')+'">'+(b?Math.round(pct)+'%':'—')+'</span></div><div class="bar"><i class="'+cls+'" style="width:'+Math.min(100,pct)+'%"></i></div><div class="cat-meta"><span>المصروف <b class="num">'+fmt(a)+'</b></span><span>الميزانية <b class="num">'+fmt(b)+'</b></span><span class="'+(v<0?'neg':'')+'">'+(v<0?'تجاوز ':'المتبقي ')+'<b class="num">'+fmt(Math.abs(v))+'</b></span></div></div>'}).join('');
  const used=p.cats.filter(c=>p.items.some(i=>i.catId===c.id));
  if(ui.filter!=='all'&&!used.some(c=>c.id===ui.filter))ui.filter='all';
  const chips='<button data-filter="all" aria-pressed="'+(ui.filter==='all')+'">الكل</button>'+used.map(c=>'<button data-filter="'+c.id+'" aria-pressed="'+(ui.filter===c.id)+'">'+esc(c.name)+'</button>').join('');
  const list=p.items.filter(i=>ui.filter==='all'||i.catId===ui.filter).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.t||0)-(a.t||0));
  const key=i=>i.src+':'+i.id;
  const items=list.length?list.map(i=>'<div class="item"><div class="item-main"><div class="item-desc">'+esc(i.desc)+'</div><div class="item-meta"><span>'+esc(catName(i.catId))+'</span><span class="num">'+esc(i.date)+'</span>'+(i.ref?'<span>مرجع: '+esc(i.ref)+'</span>':'')+'<span class="who">سجّلها: '+esc(who(i))+'</span></div></div><div class="item-end"><b class="num">'+fmt(i.amount)+'</b><button class="link del'+(armed===key(i)?' armed':'')+'" data-del="'+esc(key(i))+'">'+(armed===key(i)?'تأكيد الحذف':'حذف')+'</button></div></div>').join('')
    :'<p class="empty">'+(p.items.length?'لا توجد مصروفات في هذا البند.':'لا توجد مصروفات بعد. سجّلها أنت من الزر بالأسفل، من الزر بالأسفل.')+'</p>';
  let hint;
  if(!k.BAC)hint='ابدأ بإدخال ميزانية كل بند من «تعديل الميزانية».';
  else if(k.rem<0)hint='المصروف تجاوز الميزانية المعتمدة بنسبة '+Math.round(-k.rem/k.BAC*100)+'%.';
  else hint='تم صرف '+Math.round(k.AC/k.BAC*100)+'% من الميزانية'+(k.pr?' مقابل إنجاز '+Math.round(k.pr*100)+'% من الأعمال.':'.');
  const cpiCls=k.CPI==null?'':k.CPI<1?'neg':'pos';
  root.innerHTML=
  '<header class="top"><label class="sr" for="projSel">المشروع</label><select id="projSel">'+catalog.projects.map(x=>'<option value="'+x.id+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><button data-act="new">مشروع جديد</button><div class="status" id="status" role="status">'+esc(statusMsg)+'</div><div class="role">البيانات محفوظة على هذا الجهاز فقط. احتفظ بنسخة احتياطية قبل تغيير الجهاز أو مسح بيانات المتصفح.</div></header>'+
  '<section class="hero"><div class="hero-nums"><div class="big"><span class="lbl">المصروف الفعلي</span><span class="val num">'+fmt(k.AC)+'</span><span class="cur">ر.س</span></div><div class="side"><div><span class="lbl">الميزانية</span><b class="num">'+fmt(k.BAC)+'</b></div><div><span class="lbl">'+(k.rem<0?'تجاوز الميزانية':'المتبقي')+'</span><b class="num '+(k.rem<0?'neg':'')+'">'+fmt(Math.abs(k.rem))+'</b></div></div></div>'+
  '<div class="ruler" role="img" aria-label="المصروف '+fmt(k.AC)+' من ميزانية '+fmt(k.BAC)+'"><div class="track"><div class="fill" style="width:'+fillW+'%"></div>'+(overW?'<div class="overrun" style="inset-inline-start:'+bPos+'%;width:'+overW+'%"></div>':'')+ticks+(k.BAC?'<span class="bmark" style="inset-inline-start:'+bPos+'%"></span>':'')+(k.pr&&k.BAC?'<span class="ev" style="inset-inline-start:'+evPos+'%"><i></i></span>':'')+'</div><div class="scale">'+scaleLbl+'</div></div>'+
  '<div class="legend"><span class="lg-fill">المصروف الفعلي</span><span class="lg-b">حد الميزانية</span>'+(k.pr?'<span class="lg-ev">قيمة الأعمال المنجزة</span>':'')+'</div><p class="hint">'+esc(hint)+'</p></section>'+
  '<section class="kpis">'+
   '<div class="kpi"><span class="lbl">نسبة الإنجاز</span><b class="num">'+Math.round(k.pr*100)+'%</b><small>'+(k.pr?'قيمة المنجز '+fmt(k.EV):'حدّدها من «تعديل الميزانية»')+'</small></div>'+
   '<div class="kpi"><span class="lbl">مؤشر أداء التكلفة CPI</span><b class="num '+cpiCls+'">'+(k.CPI==null?'—':k.CPI.toFixed(2))+'</b><small>'+(k.CPI==null?'يُحسب بعد إدخال الإنجاز والمصروفات':k.CPI<1?'التكلفة أعلى من قيمة المنجز':'التكلفة ضمن قيمة المنجز')+'</small></div>'+
   '<div class="kpi"><span class="lbl">التكلفة المتوقعة EAC</span><b class="num">'+(k.EAC==null?'—':fmt(k.EAC))+'</b><small>عند إكمال المشروع بنفس الأداء</small></div>'+
   '<div class="kpi"><span class="lbl">الانحراف المتوقع VAC</span><b class="num '+(k.VAC==null?'':k.VAC<0?'neg':'pos')+'">'+(k.VAC==null?'—':(k.VAC<0?'−':'+')+fmt(Math.abs(k.VAC)))+'</b><small>'+(k.VAC==null?'الميزانية ناقص التكلفة المتوقعة':k.VAC<0?'تجاوز متوقع للميزانية':'وفر متوقع')+'</small></div>'+
  '</section>'+
  '<section class="block"><div class="block-head"><h2>بنود الميزانية</h2><button data-act="settings">تعديل الميزانية</button></div>'+cats+'</section>'+
  '<section class="block"><div class="block-head"><h2>المصروفات</h2><span class="num" style="color:var(--muted);font-size:.85rem">'+p.items.length+'</span></div>'+(used.length>1?'<div class="chips">'+chips+'</div>':'')+items+'</section>'+
  '<div class="dock"><button class="primary" data-act="add">إضافة مصروف</button>'+'<button data-act="csv">CSV</button><button data-act="backup">نسخة احتياطية</button><button data-act="restore">استعادة</button>'+'</div>';
}

const dlgEl=document.getElementById('dlg');
function dlg(html){dlgEl.innerHTML='<div class="dlg">'+html+'</div>';dlgEl.showModal();return dlgEl}

function openAdd(){
  const p=projView(ui.active);
  const d=dlg('<h3>إضافة مصروف</h3><label class="field"><span>الوصف</span><input id="fDesc" autocomplete="off" placeholder="مثال: توريد حديد تسليح 16 مم"></label>'+
    '<label class="field"><span>البند</span><select id="fCat">'+p.cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label>'+
    '<label class="field"><span>المبلغ (ر.س)</span><input id="fAmt" class="num" inputmode="decimal" dir="ltr" placeholder="0"></label>'+
    '<label class="field"><span>التاريخ</span><input id="fDate" type="date" value="'+today()+'"></label>'+
    '<label class="field"><span>رقم الفاتورة أو المستخلص (اختياري)</span><input id="fRef" autocomplete="off"></label>'+
    '<p class="err" id="fErr"></p><div class="row-end"><button class="primary" data-dlg="saveItem">إضافة المصروف</button><button data-dlg="close">إلغاء</button></div>');
  if(ui.filter!=='all')d.querySelector('#fCat').value=ui.filter;
  d.querySelector('#fDesc').focus();
}
function saveItem(){
  const g=s=>dlgEl.querySelector(s).value.trim(),err=dlgEl.querySelector('#fErr'),amt=num(g('#fAmt'));
  if(!g('#fDesc'))return err.textContent='اكتب وصف المصروف.';
  if(!(amt>0))return err.textContent='أدخل مبلغًا أكبر من صفر.';
  const item={id:uid(),t:Date.now(),projectId:ui.active,desc:g('#fDesc'),catId:g('#fCat'),amount:amt,date:g('#fDate')||today(),ref:g('#fRef')};
  entries.items.push(item);dlgEl.close();render();
  write('private/entries',()=>({items:entries.items})).then(()=>setStatus('تم الحفظ')).catch(e=>{entries.items=entries.items.filter(x=>x.id!==item.id);render();setStatus(writeErr(e))});
}
function catRow(id,name,b){return '<div class="catrow" data-cat="'+id+'"><input aria-label="اسم البند" value="'+esc(name)+'" placeholder="اسم البند"><input aria-label="ميزانية البند" class="num" inputmode="decimal" dir="ltr" value="'+(+b||0)+'"><button data-dlg="rmCat" aria-label="حذف البند">✕</button></div>'}
function openSettings(isNew){
  const p=isNew?{name:'',progress:0,cats:DEFAULT_CATS.map(n=>({id:uid(),name:n,budget:0}))}:projView(ui.active);
  const d=dlg('<h3>'+(isNew?'مشروع جديد':'الميزانية والإنجاز')+'</h3>'+
    '<label class="field"><span>اسم المشروع</span><input id="sName" value="'+esc(p.name)+'" placeholder="مثال: طريق الخدمة – المرحلة الثانية"></label>'+
    '<label class="field"><span>نسبة الإنجاز الفعلية (%)</span><input id="sProg" class="num" inputmode="decimal" dir="ltr" value="'+p.progress+'"></label>'+
    '<hr class="divider"><div class="field"><span>البنود وميزانياتها (ر.س).</span><div id="sCats">'+p.cats.map(c=>catRow(c.id,c.name,c.budget)).join('')+'</div><button data-dlg="addCat">إضافة بند</button></div>'+
    (!isNew&&catalog.projects.length>1?'<hr class="divider"><button class="link danger" data-dlg="delProj">حذف هذا المشروع</button>':'')+
    '<p class="err" id="sErr"></p><div class="row-end"><button class="primary" data-dlg="saveSettings">'+(isNew?'إنشاء المشروع':'حفظ التعديلات')+'</button><button data-dlg="close">إلغاء</button></div>');
  d.dataset.isNew=isNew?'1':'';
}
function persistCatalog(){
  return Promise.all([write('catalog/main',()=>({projects:catalog.projects})),write('private/budget',()=>({projects:budget.projects}))])
    .then(()=>setStatus('تم الحفظ')).catch(e=>setStatus(writeErr(e)));
}
function saveSettings(){
  const err=dlgEl.querySelector('#sErr'),isNew=!!dlgEl.dataset.isNew,name=dlgEl.querySelector('#sName').value.trim();
  if(!name)return err.textContent='اكتب اسم المشروع.';
  const prog=num(dlgEl.querySelector('#sProg').value)||0;
  if(prog<0||prog>100)return err.textContent='نسبة الإنجاز يجب أن تكون بين 0 و100.';
  const rows=[...dlgEl.querySelectorAll('.catrow')].map(r=>{const i=r.querySelectorAll('input');return{id:r.dataset.cat,name:i[0].value.trim(),budget:num(i[1].value)||0}}).filter(c=>c.name);
  if(!rows.length)return err.textContent='أضف بندًا واحدًا على الأقل.';
  if(rows.some(c=>c.budget<0))return err.textContent='الميزانية لا يمكن أن تكون سالبة.';
  const pid=isNew?uid():ui.active;
  if(!isNew){
    const keep=new Set(rows.map(c=>c.id)),its=allItems().filter(i=>i.projectId===pid);
    const blocked=projView(pid).cats.filter(c=>!keep.has(c.id)&&its.some(i=>i.catId===c.id));
    if(blocked.length)return err.textContent='لا يمكن حذف بند عليه فواتير: '+blocked.map(c=>c.name).join('، ');
  }
  const entry={id:pid,name,cats:rows.map(c=>({id:c.id,name:c.name}))};
  if(isNew)catalog.projects.push(entry);else catalog.projects=catalog.projects.map(p=>p.id===pid?entry:p);
  budget.projects[pid]={progress:prog,budgets:Object.fromEntries(rows.map(c=>[c.id,c.budget]))};
  ui.active=pid;ui.filter='all';stashUi();dlgEl.close();render();persistCatalog();
}
function delProject(){
  const pid=ui.active;
  if(allItems().some(i=>i.projectId===pid)){dlgEl.querySelector('#sErr').textContent='لا يمكن حذف مشروع عليه فواتير. احذف الفواتير أولًا.';return}
  catalog.projects=catalog.projects.filter(p=>p.id!==pid);delete budget.projects[pid];
  ui.active=null;dlgEl.close();render();persistCatalog();
}
function deleteItem(k){
  const i=k.indexOf(':'),src=k.slice(0,i),id=k.slice(i+1);
  if(src==='owner'){entries.items=entries.items.filter(x=>x.id!==id);render();write('private/entries',()=>({items:entries.items})).then(()=>setStatus('تم الحذف')).catch(e=>setStatus(writeErr(e)))}
  else if(invoices[src]){const d=invoices[src];d.items=d.items.filter(x=>x.id!==id);render();write('invoices/'+src,()=>Object.assign({},d,{items:d.items})).then(()=>setStatus('تم الحذف')).catch(e=>setStatus(writeErr(e)))}
}
function download(filename,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportCsv(){
  const p=projView(ui.active),k=calc(p),qq=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',cn=id=>(p.cats.find(c=>c.id===id)||{}).name||'';
  const L=[[qq('المشروع'),qq(p.name)].join(','),'',['البند','الميزانية','المصروف','المتبقي'].map(qq).join(',')];
  p.cats.forEach(c=>{const a=k.by[c.id]||0;L.push([qq(c.name),c.budget,a,c.budget-a].join(','))});
  L.push([qq('الإجمالي'),k.BAC,k.AC,k.rem].join(','),'',['التاريخ','البند','الوصف','المرجع','سجّلها','المبلغ'].map(qq).join(','));
  [...p.items].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(i=>L.push([qq(i.date),qq(cn(i.catId)),qq(i.desc),qq(i.ref),qq(who(i)),+i.amount].join(',')));
  download('project-costs-'+today()+'.csv','\ufeff'+L.join('\r\n'),'text/csv;charset=utf-8');setStatus('تم تصدير CSV');
}
function backup(){download('project-costs-backup-'+today()+'.json',JSON.stringify({version:1,catalog,budget,entries,exportedAt:new Date().toISOString()},null,2),'application/json');setStatus('تم تنزيل النسخة الاحتياطية')}
function restore(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{if(!f.files[0])return;try{const x=JSON.parse(await f.files[0].text());if(!x.catalog||!Array.isArray(x.catalog.projects)||!x.budget||!x.budget.projects||!x.entries||!Array.isArray(x.entries.items))throw Error('format');if(!confirm('استعادة النسخة ستستبدل كل البيانات الحالية على هذا الجهاز. هل تريد المتابعة؟'))return;const old={catalog,budget,entries};catalog=x.catalog;budget=x.budget;entries=x.entries;try{saveLocal()}catch(e){({catalog,budget,entries}=old);throw e}ui.active=null;render();setStatus('تمت الاستعادة')}catch(e){setStatus('ملف النسخة الاحتياطية غير صالح أو تعذّر الحفظ')}};f.click()}
root.addEventListener('change',e=>{if(e.target.id==='projSel'){ui.active=e.target.value;ui.filter='all';armed=null;stashUi();render()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!(root.contains(b)||dlgEl.contains(b)))return;
  if(b.dataset.filter){ui.filter=b.dataset.filter;stashUi();render();return}
  if(b.dataset.del){const k=b.dataset.del;if(armed===k){armed=null;deleteItem(k)}else{armed=k;render();setTimeout(()=>{if(armed===k){armed=null;render()}},4000)}return}
  const act=b.dataset.act;
  if(act==='add')openAdd();else if(act==='settings')openSettings(false);else if(act==='new')openSettings(true);else if(act==='csv')exportCsv();else if(act==='backup')backup();else if(act==='restore')restore();
  const da=b.dataset.dlg;if(!da)return;
  if(da==='close')dlgEl.close();
  else if(da==='saveItem')saveItem();
  else if(da==='saveSettings')saveSettings();
  else if(da==='addCat'){dlgEl.querySelector('#sCats').insertAdjacentHTML('beforeend',catRow(uid(),'',0));const r=dlgEl.querySelectorAll('.catrow');r[r.length-1].querySelector('input').focus()}
  else if(da==='rmCat')b.closest('.catrow').remove();
  else if(da==='delProj'){if(b.dataset.armed)delProject();else{b.dataset.armed='1';b.textContent='اضغط مرة أخرى لتأكيد حذف المشروع'}}
});
dlgEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();if(dlgEl.querySelector('#fDesc'))saveItem();else saveSettings()}});
})();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
